<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1400" height="600" fill="#fff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#222">А5. Стенд целиком: сравнение с симуляцией и первая работа с АВК-6 проводами</text>
