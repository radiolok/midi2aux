<rect x="757" y="578" width="18" height="14" rx="3" fill="#e3e8ef" stroke="#475569"/>
<text x="781" y="589.5" font-size="11.5" fill="#333">прибор</text>
<rect x="833" y="578" width="18" height="14" rx="3" fill="#d8e7fa" stroke="#1f5fa8"/>
<text x="857" y="589.5" font-size="11.5" fill="#333">ПК</text>
<rect x="881" y="578" width="18" height="14" rx="3" fill="#fff3b0" stroke="#9a7d00"/>
<text x="905" y="589.5" font-size="11.5" fill="#333">АВК-6</text>
<rect x="950" y="578" width="34" height="14" rx="7" fill="#c62828"/><text x="967" y="589" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">А2.1</text><text x="992" y="589.5" font-size="11.5" fill="#333">точка проверки (пункт таблицы)</text>
