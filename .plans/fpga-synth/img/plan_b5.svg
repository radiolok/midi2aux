<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1400" height="600" fill="#fff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#222">Б5. Блок в корзине АВК-6: интеграция и демонстрационные наборы</text>
<rect x="20" y="70" width="1360" height="430" rx="7" fill="#fff3b0" stroke="#9a7d00" stroke-width="1.6"/>
<text x="700.0" y="289.5" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold"></text>
<text x="40" y="95" font-size="13" text-anchor="start" fill="#222" font-weight="bold">АВК-6: сборочная панель на 6 сменных модулей, генератор, индикатор XY, источник питания</text>
<rect x="60" y="130" width="230" height="120" rx="7" fill="#fff3b0" stroke="#9a7d00" stroke-width="1.6"/>
<text x="175.0" y="170.5" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Генератор АВК</text>
<text x="175.0" y="186.5" font-size="11.5" text-anchor="middle" fill="#333">синус / меандр</text>
<text x="175.0" y="202.5" font-size="11.5" text-anchor="middle" fill="#333">0.1 … 1100 Гц</text>
<text x="175.0" y="218.5" font-size="11.5" text-anchor="middle" fill="#333">меандр → нижний разъём</text>
<rect x="380" y="130" width="300" height="300" rx="7" fill="#fbe4ec" stroke="#a33a63" stroke-width="1.6"/>
<text x="530.0" y="228.5" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Блок синтезатора</text>
<text x="530.0" y="244.5" font-size="11.5" text-anchor="middle" fill="#333">слот сборочной панели</text>
<text x="530.0" y="260.5" font-size="11.5" text-anchor="middle" fill="#333">питание и СИНХР — нижний разъём</text>
<text x="530.0" y="276.5" font-size="11.5" text-anchor="middle" fill="#333"></text>
<text x="530.0" y="292.5" font-size="11.5" text-anchor="middle" fill="#333">ВХ1, ВХ2 ← модули АВК</text>
<text x="530.0" y="308.5" font-size="11.5" text-anchor="middle" fill="#333">ВЫХ, ВЫХ2 → модули АВК</text>
<text x="530.0" y="324.5" font-size="11.5" text-anchor="middle" fill="#333">MIDI ← клавиатура</text>
<text x="530.0" y="340.5" font-size="11.5" text-anchor="middle" fill="#333">НАУШН./ЛИН. → запись</text>
<rect x="770" y="130" width="260" height="90" rx="7" fill="#fff3b0" stroke="#9a7d00" stroke-width="1.6"/>
<text x="900.0" y="171.5" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Линейный блок</text>
<text x="900.0" y="187.5" font-size="11.5" text-anchor="middle" fill="#333">интегратор</text>
<rect x="770" y="240" width="260" height="90" rx="7" fill="#fff3b0" stroke="#9a7d00" stroke-width="1.6"/>
<text x="900.0" y="289.5" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Умножитель / нелинейный</text>
<rect x="1080" y="130" width="270" height="120" rx="7" fill="#fff3b0" stroke="#9a7d00" stroke-width="1.6"/>
<text x="1215.0" y="178.5" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Индикатор XY</text>
<text x="1215.0" y="194.5" font-size="11.5" text-anchor="middle" fill="#333">фазовые траектории</text>
<text x="1215.0" y="210.5" font-size="11.5" text-anchor="middle" fill="#333">осциллограммы</text>
<rect x="770" y="350" width="260" height="80" rx="7" fill="#fff3b0" stroke="#9a7d00" stroke-width="1.6"/>
<text x="900.0" y="394.5" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">Сумматоры</text>
