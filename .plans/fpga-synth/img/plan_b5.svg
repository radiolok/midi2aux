<text x="308" y="589.5" font-size="11.5" fill="#333">готовый модуль</text>
<rect x="416" y="578" width="18" height="14" rx="3" fill="#fde2c8" stroke="#b5651d"/>
<text x="440" y="589.5" font-size="11.5" fill="#333">макетка (своя схема)</text>
<rect x="590" y="578" width="18" height="14" rx="3" fill="#fbe4ec" stroke="#a33a63"/>
