<text x="725.0" y="277.5" font-size="11" text-anchor="middle" fill="#444">ВЫХ</text>
<polyline points="1030,285.0 1055,285 1055,210 1080,210" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="1030,175.0 1080,166.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="770,390.0 680,385.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="725.0" y="382.5" font-size="11" text-anchor="middle" fill="#444">→ ВХ2</text>
<rect x="511.1" y="440" width="37.8" height="18" rx="9" fill="#c62828"/>
<text x="530" y="453.5" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">Б5.1</text>
<rect x="291.1" y="195" width="37.8" height="18" rx="9" fill="#c62828"/>
<text x="310" y="208.5" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">Б5.2</text>
<rect x="706.1" y="145" width="37.8" height="18" rx="9" fill="#c62828"/>
<text x="725" y="158.5" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">Б5.3</text>
<rect x="1196.1" y="260" width="37.8" height="18" rx="9" fill="#c62828"/>
<text x="1215" y="273.5" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">Б5.4</text>
<text x="20" y="535" font-size="12" text-anchor="start" fill="#444">Наборы (пункт Б5.3): синт под управлением АВК (ВХ → срез, СИНХР → ноты, жёсткая синхронизация); АВК под управлением синта</text>
<text x="20" y="553" font-size="12" text-anchor="start" fill="#444">(ВЫХ2 = огибающая, LFO, 1 В/окт → интегратор, умножитель); обработка сигналов АВК (MATH как умножитель, DELAY, REVERB на ВХ).</text>
<text x="20" y="590" font-size="11.5" fill="#555">Обозначения:</text>
<rect x="110" y="578" width="18" height="14" rx="3" fill="#ece0f8" stroke="#6a3fa0"/>
